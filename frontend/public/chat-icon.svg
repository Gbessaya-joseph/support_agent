<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.75" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <!-- Glow layer (blur + opacity) -->
  <circle cx="20" cy="20" r="20" fill="url(#glowGradient)" filter="url(#blur)" />

  <!-- Main circle -->
